<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>रविवार पेठ | शिक्षक नोंदवही</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --navy:#16303F;
    --navy-2:#1F435A;
    --paper:#F6F1E4;
    --paper-2:#EEE6D2;
    --card:#FFFEFA;
    --ink:#241F17;
    --ink-soft:#5B5546;
    --line:#D9CDAE;
    --maroon:#8A2E3B;
    --maroon-dark:#6E202B;
    --gold:#A9781F;
    --green:#2E6B4E;
    --green-bg:#E4EFE7;
    --amber:#9C6B14;
    --amber-bg:#F4EAD2;
    --red:#8A2E3B;
    --red-bg:#F3E2E2;
    --radius:3px;
    --shadow:0 1px 2px rgba(22,48,63,.08), 0 4px 14px rgba(22,48,63,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Devanagari','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold);color:#fff;}

  /* ---------- Letterhead ---------- */
  .letterhead{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
    color:#F3EEDF;
    padding:18px 20px 16px;
    border-bottom:4px solid var(--gold);
    position:relative;
  }
  .letterhead-inner{
    max-width:1180px;margin:0 auto;
    display:flex;align-items:center;gap:14px;justify-content:space-between;
    flex-wrap:wrap;
  }
  .lh-title-block{display:flex;align-items:center;gap:12px;min-width:0;}
  .seal{
    width:46px;height:46px;flex:0 0 auto;border-radius:50%;
    border:2px solid #D8C088;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, #2A5069, #16303F);
    font-family:'Noto Serif',serif;font-weight:700;color:#E9CE8E;font-size:18px;
  }
  .lh-text h1{
    font-family:'Noto Sans Devanagari','Noto Serif',serif;
    font-size:19px;line-height:1.35;margin:0;font-weight:700;letter-spacing:.2px;
  }
  .lh-text p{margin:2px 0 0;font-size:12.5px;color:#C9D4D9;font-family:'Noto Serif',serif;font-style:italic;}
  .lh-actions{display:flex;align-items:center;gap:10px;}
  .admin-pill{
    display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:20px;font-size:12.5px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#7FBE95;}
  .btn{
    font-family:inherit;cursor:pointer;border:none;border-radius:var(--radius);
    padding:8px 14px;font-size:13.5px;font-weight:600;letter-spacing:.2px;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-gold{background:var(--gold);color:#241905;}
  .btn-gold:hover{background:#BC8A2C;}
  .btn-outline-light{background:transparent;color:#F3EEDF;border:1px solid rgba(255,255,255,.4);}
  .btn-outline-light:hover{background:rgba(255,255,255,.1);}
  .btn-maroon{background:var(--maroon);color:#fff;}
  .btn-maroon:hover{background:var(--maroon-dark);}
  .btn-navy{background:var(--navy);color:#F3EEDF;}
  .btn-navy:hover{background:var(--navy-2);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- Tabs ---------- */
  .tabbar{
    background:var(--card);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .tabbar-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 20px;overflow-x:auto;}
  .tab-btn{
    background:none;border:none;font-family:inherit;cursor:pointer;
    padding:13px 16px 11px;font-size:14px;font-weight:600;color:var(--ink-soft);
    border-bottom:3px solid transparent;white-space:nowrap;
  }
  .tab-btn.active{color:var(--maroon);border-bottom-color:var(--maroon);}

  /* ---------- Layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:20px;}
  .hidden{display:none !important;}

  h2.section-title{
    font-family:'Noto Serif',serif;font-weight:700;font-size:19px;color:var(--navy);
    margin:0 0 3px;
  }
  p.section-sub{margin:0 0 16px;color:var(--ink-soft);font-size:13px;}

  /* ---------- Dashboard ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--navy);
  }
  .stat-card .num{font-family:'Noto Serif',serif;font-size:26px;font-weight:700;color:var(--navy);}
  .stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat-card.c-complete{border-top-color:var(--green);} .stat-card.c-complete .num{color:var(--green);}
  .stat-card.c-process{border-top-color:var(--amber);} .stat-card.c-process .num{color:var(--amber);}
  .stat-card.c-not{border-top-color:var(--red);} .stat-card.c-not .num{color:var(--red);}
  .stat-card.c-blue{border-top-color:#3B6EA5;} .stat-card.c-blue .num{color:#3B6EA5;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:18px;}
  .panel h3{margin:0 0 12px;font-size:14.5px;color:var(--navy);font-family:'Noto Serif',serif;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
  .bar-row .bar-label{width:190px;flex:0 0 auto;color:var(--ink-soft);}
  .bar-track{flex:1;background:var(--paper-2);border-radius:8px;height:14px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;}
  .bar-row .bar-val{width:44px;text-align:right;font-weight:600;color:var(--ink);}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
  .input, select.input{
    font-family:inherit;border:1px solid var(--line);background:var(--card);
    padding:8px 10px;border-radius:var(--radius);font-size:13.5px;color:var(--ink);
  }
  .input:focus, select.input:focus{outline:2px solid #C9AE6E;outline-offset:0;border-color:var(--gold);}
  .search-input{flex:1;min-width:180px;}
  .spacer{flex:1;}
  .result-count{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}

  /* ---------- Table ---------- */
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);}
  table.data{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
  table.data thead th{
    text-align:left;background:var(--navy);color:#EFE9D8;padding:10px 12px;
    font-weight:600;font-size:12.5px;position:sticky;top:0;
  }
  table.data tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.data tbody tr:hover{background:var(--paper-2);}
  table.data tbody tr:last-child td{border-bottom:none;}
  .muted{color:var(--ink-soft);}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-red{background:var(--red-bg);color:var(--red);}
  .badge-blue{background:#DCE6EE;color:#3B6EA5;}
  .row-actions{display:flex;gap:6px;white-space:nowrap;}
  .pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .page-info{font-size:12.5px;color:var(--ink-soft);margin:0 8px;}

  /* ---------- School cards ---------- */
  .school-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
  .school-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s;
  }
  .school-card:hover{border-color:var(--gold);}
  .school-card h4{margin:0 0 4px;font-size:14px;color:var(--navy);line-height:1.35;font-family:'Noto Serif',serif;}
  .school-card .meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
  .school-card .badges{display:flex;gap:5px;flex-wrap:wrap;}
  .mini-badge{font-size:10.5px;padding:1px 7px;border-radius:10px;font-weight:600;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,30,35,.55);
    display:flex;align-items:flex-start;justify-content:center;
    padding:26px 14px;overflow-y:auto;z-index:100;
  }
  .modal{
    background:var(--paper);border-radius:6px;max-width:560px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:5px solid var(--gold);
    animation:pop .12s ease-out;
  }
  @keyframes pop{from{transform:translateY(6px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;}
  .modal-head h3{margin:0;font-family:'Noto Serif',serif;font-size:17px;color:var(--navy);}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px;}
  .modal-body{padding:6px 18px 18px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field .input{width:100%;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .custom-row{display:flex;gap:8px;margin-bottom:8px;}
  .custom-row .input{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .helptext{font-size:12px;color:var(--ink-soft);margin:-2px 0 10px;}
  .divider{border:none;border-top:1px solid var(--line);margin:14px 0;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .big{font-size:30px;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#F3EEDF;padding:10px 18px;border-radius:6px;
    font-size:13.5px;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity .2s, bottom .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;bottom:30px;}

  .notice{background:#FBF2DC;border:1px solid #E4CE95;color:#5C4413;padding:10px 13px;border-radius:4px;font-size:12.5px;margin-bottom:16px;}

  footer.foot{text-align:center;padding:26px 14px 34px;color:var(--ink-soft);font-size:12px;}

  @media (max-width:600px){
    .lh-text h1{font-size:16px;}
    .bar-row .bar-label{width:120px;font-size:12px;}
    .field-row{flex-direction:column;gap:0;}
  }
</style>
</head>

/* =========================================================
   GOOGLE SHEET SYNC
   ========================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGYiFsV-ee7CpNG1uEj9PEQzKuw9W3-BXRBrlm49CKwiFjFbhAdFPqMlXBqHz82RU/exec";
let sheetSync = { connected:false, lastSync:null, busy:false };

function normalizeRecord(r){
  return {
    id: r.id || uid(),
    brc: r.brc || '',
    school: r.school || '',
    udise: (r.udise!==undefined && r.udise!==null) ? String(r.udise) : '',
    teacher: r.teacher || '',
    status: STATUS_OPTS.includes(r.status) ? r.status : 'Active',
    custom: (r.custom && typeof r.custom === 'object') ? r.custom : {}
  };
}
async function fetchFromSheet(){
  const res = await fetch(SCRIPT_URL + '?action=list');
  if(!res.ok) throw new Error('HTTP '+res.status);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'sheet error');
  return json.data;
}
async function pushAllToSheet(records){
  const res = await fetch(SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight
    body: JSON.stringify({action:'sync', records})
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'sync failed');
  return json;
}
async function upsertToSheet(record){
  const res = await fetch(SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'upsert', record})
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'upsert failed');
  return json;
}
async function deleteFromSheetRemote(id){
  const res = await fetch(SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'delete', id})
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'delete failed');
  return json;
}

/* =========================================================
   STORAGE (local cache, with Google Sheet as source of truth)
   ========================================================= */
async function loadDB(){
  try{
    const res = await window.storage.get('teachers-db', true);
    if(res && res.value) DB = JSON.parse(res.value);
  }catch(e){ /* no local cache yet */ }
  if(!DB || !DB.length) DB = SEED_DATA.map(r => normalizeRecord(r));

  try{
    const sheetData = await fetchFromSheet();
    sheetSync.connected = true;
    if(sheetData && sheetData.length){
      DB = sheetData.map(normalizeRecord);
      await saveDB();
    }else{
      // Sheet is empty (first run) — push current data up as the initial migration
      await pushAllToSheet(DB);
    }
    sheetSync.lastSync = new Date();
  }catch(e){
    sheetSync.connected = false;
    console.warn('Google Sheet sync unavailable:', e.message);
    await saveDB();
  }
}
async function saveDB(){
  try{
    await window.storage.set('teachers-db', JSON.stringify(DB), true);
  }catch(e){
    showToast('जतन करताना त्रुटी आली (storage error)');
  }
}
async function getAdminPassword(){
  try{
    const res = await window.storage.get('admin-password', true);
    return res ? res.value : null;
  }catch(e){ return null; }
}
async function setAdminPassword(pw){
  await window.storage.set('admin-password', pw, true);
}

/* =========================================================
   HELPERS
   ========================================================= */
function uid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toastRoot');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2400);
}
function badgeClass(status){
  if(status==='Active') return 'badge-green';
  if(status==='Transferred') return 'badge-amber';
  if(status==='Retired') return 'badge-blue';
  if(status==='Resigned') return 'badge-red';
  return 'badge-amber';
}
function statusLabel(status){ return STATUS_LABEL_MR[status] || status || '—'; }
function uniqueSchools(){
  const map = new Map();
  DB.forEach(r=>{
    const key = r.school+'||'+r.udise;
    if(!map.has(key)) map.set(key, {school:r.school, udise:r.udise, brc:r.brc, teachers:[]});
    map.get(key).teachers.push(r);
  });
  return Array.from(map.values()).sort((a,b)=>a.school.localeCompare(b.school));
}
function allBrcs(){
  return Array.from(new Set(DB.map(r=>r.brc).filter(Boolean))).sort();
}
function customKeysFor(list){
  const keys = new Set();
  list.forEach(r=>{ if(r.custom) Object.keys(r.custom).forEach(k=>keys.add(k)); });
  return Array.from(keys);
}

function bindClose(ids){
  ids.forEach(id=>{
    const e = document.getElementById(id);
    if(e) e.onclick = (ev)=>{ if(ev.target.id===id) closeModal(); };
  });
}

function openTeacherForm(record){
  const isEdit = !!record;
  const r = record || {id:null, brc:(allBrcs()[0]||''), school:'', udise:'', teacher:'', status:'Active', custom:{}};
  const root = document.getElementById('modalRoot');
  const customEntries = Object.entries(r.custom||{});
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <div class="modal-head"><h3>${isEdit? 'शिक्षक माहिती संपादित करा':'नवीन शिक्षक जोडा'}</h3><button class="modal-close" id="mc">×</button></div>
        <div class="modal-body">
          <div class="field-row">
            <div class="field"><label>BRC / तालुका</label><input class="input" id="f_brc" value="${esc(r.brc)}"></div>
            <div class="field"><label>UDISE क्रमांक</label><input class="input" id="f_udise" value="${esc(r.udise)}"></div>
          </div>
          <div class="field"><label>शाळेचे नाव</label><input class="input" id="f_school" value="${esc(r.school)}"></div>
          <div class="field"><label>शिक्षकाचे नाव</label><input class="input" id="f_teacher" value="${esc(r.teacher)}"></div>
          <div class="field"><label>स्थिती</label>
            <select class="input" id="f_status">
              ${STATUS_OPTS.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${statusLabel(s)}</option>`).join('')}
            </select>
          </div>
          <hr class="divider">
          <label style="font-size:12.5px;font-weight:600;color:var(--ink-soft);">अतिरिक्त तपशील (पर्यायी)</label>
          <p class="helptext">उदा. मोबाईल क्रमांक, हुद्दा, टीप — आवश्यकतेनुसार नवीन क्षेत्र (field) जोडा.</p>
          <div id="customRows">
            ${customEntries.map(([k,v])=>customRowHtml(k,v)).join('')}
          </div>
          <button class="btn btn-ghost btn-sm" id="addCustomRow">+ क्षेत्र जोडा</button>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="cancel">रद्द करा</button>
            ${isEdit? `<button class="btn btn-outline-light" style="color:var(--maroon);border-color:var(--maroon);" id="delBtn">काढून टाका</button>`:''}
            <button class="btn btn-maroon" id="saveBtn">जतन करा</button>
          </div>
        </div>
      </div>
    </div>`;
  bindClose(['ov','mc','cancel']);
  document.getElementById('addCustomRow').onclick = ()=>{
    document.getElementById('customRows').insertAdjacentHTML('beforeend', customRowHtml('',''));
  };
  document.getElementById('customRows').addEventListener('click', (e)=>{
    if(e.target.classList.contains('rm-row')) e.target.closest('.custom-row').remove();
  });
  if(isEdit){
    document.getElementById('delBtn').onclick = async ()=>{
      if(!confirm('या शिक्षकाची नोंद कायमची काढायची आहे का?')) return;
      DB = DB.filter(x=>x.id!==r.id);
      await saveDB(); closeModal(); render(); showToast('नोंद काढली');
      try{ await deleteFromSheetRemote(r.id); sheetSync.connected=true; sheetSync.lastSync=new Date(); }
      catch(e){ sheetSync.connected=false; showToast('Google Sheet मधून काढणे अयशस्वी — स्थानिक पातळीवर काढले'); }
    };
  }
  document.getElementById('saveBtn').onclick = async ()=>{
    const brc = document.getElementById('f_brc').value.trim();
    const udise = document.getElementById('f_udise').value.trim();
    const school = document.getElementById('f_school').value.trim();
    const teacher = document.getElementById('f_teacher').value.trim();
    const status = document.getElementById('f_status').value;
    if(!school || !teacher){ showToast('शाळेचे नाव व शिक्षकाचे नाव आवश्यक आहे'); return; }
    const custom = {};
    document.querySelectorAll('#customRows .custom-row').forEach(row=>{
      const k = row.querySelector('.ck').value.trim();
      const v = row.querySelector('.cv').value.trim();
      if(k) custom[k]=v;
    });
    let rec;
    if(isEdit){
      const idx = DB.findIndex(x=>x.id===r.id);
      DB[idx] = {...DB[idx], brc,udise,school,teacher,status,custom};
      rec = DB[idx];
    }else{
      rec = {id:uid(), brc,udise,school,teacher,status,custom};
      DB.push(rec);
    }
    await saveDB(); closeModal(); render();
    showToast(isEdit? 'माहिती अद्ययावत झाली':'नवीन शिक्षक जोडला');
    try{ await upsertToSheet(rec); sheetSync.connected=true; sheetSync.lastSync=new Date(); }
    catch(e){ sheetSync.connected=false; showToast('Google Sheet सिंक अयशस्वी — स्थानिक पातळीवर जतन झाले'); }
  };
}
function customRowHtml(k,v){
  return `<div class="custom-row">
    <input class="input ck" placeholder="क्षेत्राचे नाव (उदा. मोबाईल)" value="${esc(k)}">
    <input class="input cv" placeholder="माहिती" value="${esc(v)}">
    <button class="btn btn-ghost btn-sm rm-row" type="button">✕</button>
  </div>`;
}

function requireAdmin(action){
  if(isAdmin){ action(); return; }
  showToast('कृपया प्रथम प्रशासक लॉगिन करा');
  openLoginModal();
}

/* =========================================================
   PDF EXPORT
   ========================================================= */
function exportSchoolPdf(schoolInfo){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const list = schoolInfo.teachers;
  const customCols = customKeysFor(list);

  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Ravivar Peth Cluster - Teacher List', 14, 16);
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text(`School: ${schoolInfo.school}`, 14, 24);
  doc.text(`UDISE No: ${schoolInfo.udise || '-'}      BRC: ${schoolInfo.brc || '-'}`, 14, 30);
  doc.text(`Generated: ${new Date().toLocaleString('en-IN')}`, 14, 36);

  const head = [['Sr','Teacher Name','Status', ...customCols]];
  const body = list.map((t,i)=>[
    i+1, t.teacher, t.status, ...customCols.map(c=> (t.custom&&t.custom[c])?t.custom[c]:'-')
  ]);
  doc.autoTable({
    head, body, startY:42, styles:{fontSize:9, cellPadding:3},
    headStyles:{fillColor:[22,48,63], textColor:255},
    alternateRowStyles:{fillColor:[246,241,228]},
    margin:{left:14,right:14}
  });
  const finalY = doc.lastAutoTable.finalY || 42;
  doc.setFontSize(9); doc.setTextColor(90);
  doc.text('This is a system-generated register extract.', 14, finalY+10);

  doc.save(`${schoolInfo.school.trim().replace(/[^a-zA-Z0-9]+/g,'_').slice(0,50)}_teachers.pdf`);
}

function exportFullPdf(list, title){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(title || 'Teacher Register - Full List', 14, 16);
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text(`Total records: ${list.length}      Generated: ${new Date().toLocaleString('en-IN')}`, 14, 24);
  const head = [['Sr','School','UDISE','Teacher Name','Status']];
  const body = list.map((t,i)=>[i+1, t.school, t.udise||'-', t.teacher, t.status]);
  doc.autoTable({
    head, body, startY:30, styles:{fontSize:8, cellPadding:2.5},
    headStyles:{fillColor:[22,48,63], textColor:255},
    alternateRowStyles:{fillColor:[246,241,228]},
    columnStyles:{1:{cellWidth:60}},
    margin:{left:12,right:12}
  });
  doc.save('teacher_register_full.pdf');
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
  const app = document.getElementById('app');
  if(state.tab==='dashboard') app.innerHTML = renderDashboard();
  else if(state.tab==='teachers') app.innerHTML = renderTeachersTab();
  else if(state.tab==='schools') app.innerHTML = renderSchoolsTab();
  attachHandlers();
}

function renderDashboard(){
  const total = DB.length;
  const schools = uniqueSchools().length;
  const byStatus = {};
  STATUS_OPTS.forEach(s=>byStatus[s]=0);
  DB.forEach(r=>{ byStatus[r.status] = (byStatus[r.status]||0)+1; });
  const brcs = allBrcs();

  const maxC = Math.max(1,...Object.values(byStatus));
  return `
    <h2 class="section-title">विहंगावलोकन</h2>
    <p class="section-sub">रविवार पेठ — एकूण नोंदवही स्थिती</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${total}</div><div class="lbl">एकूण शिक्षक</div></div>
      <div class="stat-card"><div class="num">${schools}</div><div class="lbl">एकूण शाळा</div></div>
      ${STATUS_OPTS.map(s=>`<div class="stat-card" style="border-top-color:${STATUS_COLOR[s]};"><div class="num" style="color:${STATUS_COLOR[s]};">${byStatus[s]}</div><div class="lbl">${statusLabel(s)}</div></div>`).join('')}
    </div>
    <div class="panel">
      <h3>स्थितीनुसार विभागणी</h3>
      ${STATUS_OPTS.map(s=>{
        const v = byStatus[s]; const pct = Math.round((v/maxC)*100);
        const color = STATUS_COLOR[s];
        return `<div class="bar-row">
          <div class="bar-label">${statusLabel(s)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
          <div class="bar-val">${v}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="panel">
      <h3>Google Sheet सिंक</h3>
      <p class="section-sub" style="margin-bottom:12px;">
        <span class="dot" style="background:${sheetSync.connected?'#2E6B4E':'#8A2E3B'};"></span>
        &nbsp;${sheetSync.connected? 'शीटशी जोडलेले' : 'शीटशी जोड झाली नाही'}
        ${sheetSync.lastSync? ' · शेवटचे सिंक: '+sheetSync.lastSync.toLocaleTimeString('en-IN') : ''}
      </p>
      <div class="toolbar" style="margin-bottom:0;">
        <button class="btn btn-navy" id="dashPullSheet">🔄 शीटवरून आणा</button>
        <button class="btn btn-ghost" id="dashPushSheet">⬆ सर्व डेटा शीटवर पाठवा</button>
      </div>
    </div>
    <div class="panel">
      <h3>त्वरित कृती</h3>
      <div class="toolbar" style="margin-bottom:0;">
        <button class="btn btn-navy" id="dashAddTeacher">+ नवीन शिक्षक जोडा</button>
        <button class="btn btn-ghost" id="dashExportAll">संपूर्ण यादी PDF डाउनलोड करा</button>
      </div>
    </div>
    <div class="notice">टीप: BRC आढळले — ${brcs.join(', ')||'—'}. संपादनासाठी प्रशासक लॉगिन आवश्यक आहे.</div>
  `;
}

function renderTeachersTab(){
  let list = DB.filter(r=>{
    if(state.teacherStatus && r.status!==state.teacherStatus) return false;
    if(state.teacherBrc && r.brc!==state.teacherBrc) return false;
    if(state.teacherSearch){
      const q = state.teacherSearch.toLowerCase();
      if(!(r.teacher.toLowerCase().includes(q) || r.school.toLowerCase().includes(q) || (r.udise||'').includes(q))) return false;
    }
    return true;
  });
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total/state.pageSize));
  state.teacherPage = Math.min(state.teacherPage, pages);
  const startIdx = (state.teacherPage-1)*state.pageSize;
  const pageList = list.slice(startIdx, startIdx+state.pageSize);
  const brcs = allBrcs();

  return `
    <h2 class="section-title">शिक्षक यादी</h2>
    <p class="section-sub">शोधा, गाळणी लावा आणि आवश्यकतेनुसार संपादित करा</p>
    <div class="toolbar">
      <input class="input search-input" id="tSearch" placeholder="शिक्षक / शाळा / UDISE शोधा…" value="${esc(state.teacherSearch)}">
      <select class="input" id="tStatus">
        <option value="">सर्व स्थिती</option>
        ${STATUS_OPTS.map(s=>`<option value="${s}" ${state.teacherStatus===s?'selected':''}>${statusLabel(s)}</option>`).join('')}
      </select>
      ${brcs.length>1?`<select class="input" id="tBrc">
        <option value="">सर्व BRC</option>
        ${brcs.map(b=>`<option value="${esc(b)}" ${state.teacherBrc===b?'selected':''}>${esc(b)}</option>`).join('')}
      </select>`:''}
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="exportFilteredPdf">फिल्टर केलेली यादी PDF</button>
      <button class="btn btn-navy" id="addTeacherBtn">+ नवीन शिक्षक</button>
    </div>
    <div class="result-count">${total} पैकी ${pageList.length} नोंदी दाखवत आहे</div>
    ${total===0? `<div class="empty-state"><div class="big">—</div>कोणतीही नोंद आढळली नाही</div>` : `
    <div class="table-scroll">
      <table class="data">
        <thead><tr><th>अ.क्र.</th><th>शाळा</th><th>शिक्षकाचे नाव</th><th>स्थिती</th><th>कृती</th></tr></thead>
        <tbody>
          ${pageList.map((r,i)=>`
            <tr>
              <td>${startIdx+i+1}</td>
              <td>${esc(r.school)}<br><span class="muted" style="font-size:11.5px;">UDISE: ${esc(r.udise)||'—'}</span></td>
              <td>${esc(r.teacher)}</td>
              <td><span class="badge ${badgeClass(r.status)}">${statusLabel(r.status)}</span></td>
              <td class="row-actions">
                <button class="btn btn-ghost btn-sm edit-row" data-id="${r.id}">संपादन</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <button class="btn btn-ghost btn-sm" id="prevPage" ${state.teacherPage<=1?'disabled':''}>‹ मागे</button>
      <span class="page-info">पान ${state.teacherPage} / ${pages}</span>
      <button class="btn btn-ghost btn-sm" id="nextPage" ${state.teacherPage>=pages?'disabled':''}>पुढे ›</button>
    </div>`}
  `;
}

function renderSchoolsTab(){
  const schools = uniqueSchools().filter(s=>{
    if(!state.schoolSearch) return true;
    const q = state.schoolSearch.toLowerCase();
    return s.school.toLowerCase().includes(q) || (s.udise||'').includes(q);
  });

  if(state.openSchool){
    const info = uniqueSchools().find(s=>s.school+'||'+s.udise === state.openSchool);
    if(info) return renderSchoolDetail(info);
    state.openSchool = null;
  }

  return `
    <h2 class="section-title">शाळानिहाय यादी</h2>
    <p class="section-sub">${schools.length} शाळा — प्रत्येक शाळेसाठी स्वतंत्र PDF डाउनलोड करता येईल</p>
    <div class="toolbar">
      <input class="input search-input" id="sSearch" placeholder="शाळा किंवा UDISE शोधा…" value="${esc(state.schoolSearch)}">
    </div>
    <div class="school-grid">
      ${schools.map(s=>{
        const counts = {}; STATUS_OPTS.forEach(k=>counts[k]=0);
        s.teachers.forEach(t=>counts[t.status]=(counts[t.status]||0)+1);
        return `<div class="school-card" data-key="${esc(s.school+'||'+s.udise)}">
          <h4>${esc(s.school)}</h4>
          <div class="meta">UDISE: ${esc(s.udise)||'—'} · BRC: ${esc(s.brc)||'—'} · ${s.teachers.length} शिक्षक</div>
          <div class="badges">
            ${STATUS_OPTS.map(k=> counts[k]? `<span class="mini-badge ${badgeClass(k)}">${statusLabel(k)} ${counts[k]}</span>`:'').join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
    ${schools.length===0?`<div class="empty-state"><div class="big">—</div>कोणतीही शाळा आढळली नाही</div>`:''}
  `;
}

function renderSchoolDetail(info){
  const customCols = customKeysFor(info.teachers);
  return `
    <button class="btn btn-ghost btn-sm" id="backToSchools" style="margin-bottom:14px;">‹ सर्व शाळांकडे परत जा</button>
    <div class="panel" style="margin-bottom:16px;">
      <h2 class="section-title" style="margin-bottom:8px;">${esc(info.school)}</h2>
      <p class="section-sub" style="margin-bottom:14px;">UDISE: ${esc(info.udise)||'—'} &nbsp;·&nbsp; BRC: ${esc(info.brc)||'—'} &nbsp;·&nbsp; एकूण शिक्षक: ${info.teachers.length}</p>
      <div class="toolbar" style="margin-bottom:0;">
        <button class="btn btn-maroon" id="downloadSchoolPdf">⬇ या शाळेची PDF यादी डाउनलोड करा</button>
        <button class="btn btn-navy" id="addTeacherToSchool">+ या शाळेत शिक्षक जोडा</button>
      </div>
    </div>
    <div class="table-scroll">
      <table class="data">
        <thead><tr><th>अ.क्र.</th><th>शिक्षकाचे नाव</th><th>स्थिती</th>${customCols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>कृती</th></tr></thead>
        <tbody>
          ${info.teachers.map((t,i)=>`
            <tr>
              <td>${i+1}</td>
              <td>${esc(t.teacher)}</td>
              <td><span class="badge ${badgeClass(t.status)}">${statusLabel(t.status)}</span></td>
              ${customCols.map(c=>`<td>${esc((t.custom&&t.custom[c])||'—')}</td>`).join('')}
              <td><button class="btn btn-ghost btn-sm edit-row" data-id="${t.id}">संपादन</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* =========================================================
   EVENT WIRING (after each render)
   ========================================================= */
function attachHandlers(){
  // Tabs
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{ state.tab=b.dataset.tab; state.openSchool=null; render(); };
  });

  if(state.tab==='dashboard'){
    const a = document.getElementById('dashAddTeacher');
    if(a) a.onclick = ()=> requireAdmin(()=>openTeacherForm(null));
    const e = document.getElementById('dashExportAll');
    if(e) e.onclick = ()=> exportFullPdf(DB, 'Ravivar Peth Cluster - Full Teacher Register');
    const pull = document.getElementById('dashPullSheet');
    if(pull) pull.onclick = ()=> requireAdmin(async ()=>{
      showToast('Google Sheet वरून डेटा आणत आहे…');
      try{
        const data = await fetchFromSheet();
        DB = (data||[]).map(normalizeRecord);
        await saveDB();
        sheetSync.connected = true; sheetSync.lastSync = new Date();
        render(); showToast('डेटा यशस्वीरित्या आणला');
      }catch(err){
        sheetSync.connected = false; render();
        showToast('शीटवरून आणण्यात त्रुटी आली');
      }
    });
    const push = document.getElementById('dashPushSheet');
    if(push) push.onclick = ()=> requireAdmin(async ()=>{
      showToast('सर्व डेटा Google Sheet वर पाठवत आहे…');
      try{
        await pushAllToSheet(DB);
        sheetSync.connected = true; sheetSync.lastSync = new Date();
        render(); showToast('डेटा यशस्वीरित्या पाठवला');
      }catch(err){
        sheetSync.connected = false; render();
        showToast('शीटवर पाठवण्यात त्रुटी आली');
      }
    });
  }

  if(state.tab==='teachers'){
    const s = document.getElementById('tSearch');
    if(s){ s.oninput = ()=>{ state.teacherSearch=s.value; state.teacherPage=1; render(); }; }
    const st = document.getElementById('tStatus');
    if(st){ st.onchange = ()=>{ state.teacherStatus=st.value; state.teacherPage=1; render(); }; }
    const br = document.getElementById('tBrc');
    if(br){ br.onchange = ()=>{ state.teacherBrc=br.value; state.teacherPage=1; render(); }; }
    const add = document.getElementById('addTeacherBtn');
    if(add) add.onclick = ()=> requireAdmin(()=>openTeacherForm(null));
    const exp = document.getElementById('exportFilteredPdf');
    if(exp) exp.onclick = ()=>{
      let list = DB.filter(r=>{
        if(state.teacherStatus && r.status!==state.teacherStatus) return false;
        if(state.teacherBrc && r.brc!==state.teacherBrc) return false;
        if(state.teacherSearch){
          const q=state.teacherSearch.toLowerCase();
          if(!(r.teacher.toLowerCase().includes(q) || r.school.toLowerCase().includes(q) || (r.udise||'').includes(q))) return false;
        }
        return true;
      });
      exportFullPdf(list, 'Ravivar Peth Cluster - Filtered List');
    };
    document.querySelectorAll('.edit-row').forEach(btn=>{
      btn.onclick = ()=> requireAdmin(()=>{
        const rec = DB.find(x=>x.id===btn.dataset.id);
        openTeacherForm(rec);
      });
    });
    const prev = document.getElementById('prevPage');
    if(prev) prev.onclick = ()=>{ state.teacherPage--; render(); };
    const next = document.getElementById('nextPage');
    if(next) next.onclick = ()=>{ state.teacherPage++; render(); };
  }

  if(state.tab==='schools'){
    const s = document.getElementById('sSearch');
    if(s){ s.oninput = ()=>{ state.schoolSearch=s.value; render(); }; }
    document.querySelectorAll('.school-card').forEach(card=>{
      card.onclick = ()=>{ state.openSchool = card.dataset.key; render(); };
    });
    const back = document.getElementById('backToSchools');
    if(back) back.onclick = ()=>{ state.openSchool=null; render(); };
    const dl = document.getElementById('downloadSchoolPdf');
    if(dl) dl.onclick = ()=>{
      const info = uniqueSchools().find(x=>x.school+'||'+x.udise===state.openSchool);
      if(info) exportSchoolPdf(info);
    };
    const addToSchool = document.getElementById('addTeacherToSchool');
    if(addToSchool) addToSchool.onclick = ()=> requireAdmin(()=>{
      const info = uniqueSchools().find(x=>x.school+'||'+x.udise===state.openSchool);
      openTeacherForm({id:null, brc:info.brc, school:info.school, udise:info.udise, teacher:'', status:'Active', custom:{}});
    });
    document.querySelectorAll('.edit-row').forEach(btn=>{
      btn.onclick = ()=> requireAdmin(()=>{
        const rec = DB.find(x=>x.id===btn.dataset.id);
        openTeacherForm(rec);
      });
    });
  }
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  document.getElementById('app').innerHTML = `<div class="empty-state">माहिती लोड होत आहे…</div>`;
  await loadDB();
  renderAdminArea();
  render();
})();
</script>
